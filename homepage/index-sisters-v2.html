let rng=1;function rand(){rng=(rng*1103515245+12345)&0x7fffffff;return rng/0x7fffffff;}
const SOLID=new Set(['#','=','?','U','B','!','T','|','^']);
function genLevel(n){
  rng=n*7919+13;
  const rows=Array.from({length:ROWS},()=>[]);
  const ensure=c=>{for(const r of rows)while(r.length<=c)r.push(' ');};
  const set=(c,r,ch)=>{if(r<0||r>=ROWS)return;ensure(c);rows[r][c]=ch;};
  const ground=(c,len)=>{for(let i=0;i<len;i++){set(c+i,10,'#');set(c+i,11,'#');}};
  const diff=Math.min(1+(n-1)*.3,2.6);
  let x=0;ground(0,14);set(6,6,'?');set(7,6,'?');set(8,6,'!');x=14;
  const sections=11+Math.min(n,7);
  for(let s=0;s<sections;s++){
    const r=s===0?.1:rand();
    if(r<.26){
      const len=10+Math.floor(rand()*6);ground(x,len);
      const bn=3+Math.floor(rand()*3),bx=x+2+Math.floor(rand()*(len-5-bn));
      for(let i=0;i<bn;i++){const q=rand();set(bx+i,6,q<.5?'?':q<.85?'B':'!');}
      if(rand()<.45){for(let i=-1;i<bn+1;i++)set(bx+i,3,'=');for(let i=0;i<bn;i++)set(bx+i,2,'D');}
      if(rand()<.7*diff)set(x+len-3,9,'o');
      x+=len;
    }else if(r<.46){
      const w=2+Math.floor(rand()*Math.min(3,Math.round(diff)));
      if(rand()<.5)set(x+Math.floor(w/2),7,'D');
      x+=w;ground(x,4);if(rand()<.5)set(x+1,9,'D');x+=4;
    }else if(r<.6){
      const len=7+Math.floor(rand()*4);ground(x,len);
      const h=1+Math.floor(rand()*3);for(let i=0;i<h;i++)set(x+2,9-i,i===h-1?'T':'|');
      if(rand()<.6)set(x+2,9-h-1,'D');
      if(len>9){const h2=1+Math.floor(rand()*3);for(let i=0;i<h2;i++)set(x+len-3,9-i,i===h2-1?'T':'|');}
      if(rand()<.6*diff)set(x+5,9,'o');
      x+=len;
    }else if(r<.74){
      const h=3+Math.floor(rand()*2);ground(x,h+2);
      for(let i=0;i<h;i++)for(let j=0;j<=i;j++)set(x+1+i,9-j,'=');
      set(x+h,9-h,'D');
      x+=h+2;const pit=2+Math.floor(rand()*2);x+=pit;
      ground(x,h+3);for(let i=0;i<h;i++)for(let j=0;j<=h-1-i;j++)set(x+1+i,9-j,'=');
      x+=h+3;
    }else if(r<.9){
      const len=11+Math.floor(rand()*4);ground(x,len);
      for(let i=2;i<len-3;i+=4){const py=5+Math.floor(rand()*3);for(let j=0;j<3;j++)set(x+i+j,py,'=');set(x+i+1,py-2,'D');}
      if(rand()<.75*diff)set(x+Math.floor(len/2),2,'w');
      x+=len;
    }else{
      const len=7+Math.floor(rand()*5);let gap=0;
      for(let i=0;i<len;i++){set(x+i,10,'~');set(x+i,11,'~');
        const hole=i>1&&i<len-2&&gap<2&&rand()<.28;if(hole)gap++;else{gap=0;set(x+i,10,'^');}}
      if(rand()<.7)set(x+1,9,'o');
      if(rand()<.5)set(x+2,6,'D');
      x+=len;ground(x,3);x+=3;
    }
  }
  ground(x,18);for(let i=0;i<4;i++)for(let j=0;j<=i;j++)set(x+2+i,9-j,'=');set(x+5,5,'D');set(x+13,9,'E');x+=18;ensure(x+1);
  return rows.map(r=>r);
}

    NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const n=32,re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*.25);PW=AC.createPeriodicWave(re,im);
  }catch(e){AC=null;}
}
function tone(f,d,type='square',v=.1,when=0,slide){

  const o=AC.createOscillator(),g=AC.createGain();if(type==='pulse'&&PW)o.setPeriodicWave(PW);else o.type=type==='pulse'?'square':type;
  o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.02);
}
function noise(d,v,when=0,f0=4000,f1=400,hp){

  const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;fl.type=hp?'highpass':'lowpass';
  fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);

}

let musicOn=false,nextNote=0,noteI=0;
function music(){
  if(!AC||muted||!musicOn)return;
  // resync after mute, pause or a hidden tab instead of firing every missed note at once
  if(nextNote<AC.currentTime-.05)nextNote=AC.currentTime+.02;
  const st=hurry?.086:.105;

const padOff=e=>{if(e.pointerId!==padId)return;padId=null;keys.left=keys.right=false;bl.classList.remove('dn');br.classList.remove('dn');};
pad.addEventListener('pointerup',padOff);pad.addEventListener('pointercancel',padOff);
bj.addEventListener('pointerdown',e=>{e.preventDefault();press();bj.classList.add('dn');if(state==='play'){if(!keys.jump)jumpEdge=true;keys.jump=true;}else confirmKey();});
const jOff=()=>{keys.jump=false;bj.classList.remove('dn');};
bj.addEventListener('pointerup',jOff);bj.addEventListener('pointercancel',jOff);bj.addEventListener('pointerleave',jOff);
const bm=document.getElementById('bm'),bp=document.getElementById('bp');
bm.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();press();toggleMute();});
bp.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();press();togglePause();});
function paintButtons(){bm.textContent=muted?'×':'♪';bm.classList.toggle('dn',muted);bp.textContent=state==='pause'?'▶':'II';}
cv.addEventListener('pointerdown',e=>{press();if(e.pointerType==='touch')touch.classList.add('on');if(state!=='play')confirmKey();});
function startGame(){
  level=1;lives=3;score=0;diamonds=0;pl.punk=false;bestAtStart=best;loadLevel(level);state='play';stateT=0;startMusic();
  borderBase=K;borderLoad(40);showBanner('LEVEL 1',STAGES[0]);
}
function confirmKey(){
  if(state==='title')startGame();
  else if(state==='pause')togglePause();
  else if((state==='over'||state==='win')&&stateT>1.5){state='title';stateT=0;borderBase=LB;particles=[];rings=[];floaters=[];}
}
function togglePause(){
  if(state==='play'){state='pause';musicOn=false;releaseAll();sfx.pause();}
  else if(state==='pause'){state='play';if(!pl.dead)startMusic();sfx.pause();}
  paintButtons();
}

// ═══════════════════════════ UPDATE ═══════════════════════════
const GRAV=.34,GRAV_HOLD=.21,JUMP_V=-6.4,MAXVX=2.1;
function addScore(n){score+=n;if(score>best){best=score;try{localStorage.setItem('certsisters.hi',String(best));}catch(e){}}}
function addDiamond(x,y){diamonds++;addScore(50);sfx.gem();floater(x+4,y,'50',CY);sparks(x+4,y+3,7,1.6);ring(x+4,y+3,CY,1.4,10);
  if(diamonds%100===0){lives++;sfx.life();floater(x+4,y-10,'1UP',LG,true);borderFlash([LG,GR,WH],24);}}
function bumpTile(c,r){
  const ch=at(c,r);if(!SOLID.has(ch))return;
  bumps.push({c,r,t:10});
  const cx=c*TS+8,cy=r*TS+8;
  if(ch==='?'){map[r][c]='U';entities.push({t:'gemrise',x:c*TS+4,y:r*TS+2,w:8,h:6,dead:0,vy:-1.6,life:22});addDiamond(c*TS+4,r*TS-6);pixels(cx,r*TS,6,1.5,[YE,WH,OR]);}
  else if(ch==='!'){map[r][c]='U';entities.push({t:'power',x:c*TS+4,y:r*TS-8,w:8,h:7,dead:0,vx:.7});sfx.power();puff(cx,r*TS-4,6,1.2);pixels(cx,r*TS,8,1.8,[CY,WH,LB]);}
  else if(ch==='B'&&pl.punk){map[r][c]=' ';addScore(10);sfx.brk();chunks(cx,cy,[RD,LR]);puff(cx,cy,5,1);pixels(cx,cy,10,2.4,[RD,LR,BR]);addShake(4);}
  else{sfx.bump();pixels(cx,r*TS+TS,3,1,[LGY,WH],.15,0);}
  for(const e of entities){if((e.t==='owl'||e.t==='wasp')&&!e.dead&&Math.floor((e.x+e.w/2)/TS)===c&&Math.floor((e.y+e.h)/TS)===r){e.dead=1;e.vy=-4;addScore(100);floater(e.x+7,e.y-6,'100',WH);puff(e.x+7,e.y+7,6,1.2);}}
}
function killPlayer(){if(pl.dead)return;pl.dead=true;pl.vy=-6;pl.deathT=0;pl.punk=false;musicOn=false;sfx.die();addShake(6);borderFlash([RD,K,LR,K],30);
  pixels(pl.x+5,pl.y+10,12,2.2,[WH,LR,YE]);ring(pl.x+5,pl.y+11,WH,2,16);}
function hurt(){if(pl.inv>0||pl.dead)return;
  if(pl.punk){pl.punk=false;pl.inv=90;sfx.hurt();puff(pl.x+5,pl.y+8,8,1.4);pixels(pl.x+5,pl.y+4,10,2,[RD,LR,YE]);addShake(4);borderFlash([RD,K],12);}
  else killPlayer();}
function updatePlay(dt){
  if(pl.dead){
    pl.deathT++;
    if(pl.deathT>DEATH_FREEZE){pl.vy+=GRAV;pl.y+=pl.vy;}
    updateFx();
    if(pl.deathT>90+DEATH_FREEZE){lives--;
      if(lives<=0){state='over';stateT=0;sfx.over();borderBase=RD;}
      else{loadLevel(level);startMusic();showBanner('TRY AGAIN',lives+(lives===1?' LIFE LEFT':' LIVES LEFT'),LR);}}
    return;
  }
  timeLeft-=dt;if(timeLeft<=0){timeLeft=0;killPlayer();return;}
  if(!hurry&&timeLeft<30){hurry=true;showBanner('HURRY UP!','CERT EXPIRES SOON',RD);borderFlash([RD,YE,RD,YE],36);}
  if(pl.inv>0)pl.inv--;
  const ax=keys.left?-1:keys.right?1:0;
  if(ax&&pl.ground&&Math.abs(pl.vx)>1.2&&Math.sign(pl.vx)===-ax){if(!pl.skid)dust(pl.x+5+ax*-4,pl.y+pl.h,-ax);pl.skid=6;}
  if(pl.skid>0)pl.skid--;
  if(ax){pl.vx+=ax*.16;pl.face=ax;}else pl.vx*=pl.ground?.78:.95;
  if(Math.abs(pl.vx)<.05&&!ax)pl.vx=0;
  const mv=MAXVX*(pl.punk?1.15:1);pl.vx=Math.max(-mv,Math.min(mv,pl.vx));
  // small coyote time and jump buffer make the controls feel less strict
  if(pl.ground)pl.coy=6;else if(pl.coy>0)pl.coy--;
  if(jumpEdge)pl.jbuf=7;jumpEdge=false;
  if(pl.jbuf>0){pl.jbuf--;if(pl.ground||pl.coy>0){pl.vy=JUMP_V;pl.ground=false;pl.coy=0;pl.jbuf=0;sfx.jump();pl.sqx=.8;pl.sqy=1.2;dust(pl.x+5,pl.y+pl.h,0);}}
  pl.vy+=(keys.jump&&pl.vy<0)?GRAV_HOLD:GRAV;pl.vy=Math.min(pl.vy,7);
  // horizontal
  let nx=pl.x+pl.vx;
  if(pl.vx>0&&rectSolid(nx,pl.y,pl.w,pl.h)){nx=Math.floor((nx+pl.w)/TS)*TS-pl.w-.01;pl.vx=0;}
  else if(pl.vx<0&&rectSolid(nx,pl.y,pl.w,pl.h)){nx=Math.floor(nx/TS+1)*TS+.01;pl.vx=0;}
  pl.x=Math.max(0,nx);
  // vertical
  const wasGround=pl.ground,vyIn=pl.vy;
  let ny=pl.y+pl.vy;pl.ground=false;
  // probe one pixel below the feet so standing still stays grounded every frame
  if(pl.vy>0&&rectSolid(pl.x,ny+1,pl.w,pl.h)){ny=Math.floor((ny+pl.h)/TS)*TS-pl.h;pl.vy=0;pl.ground=true;}
  else if(pl.vy<0&&rectSolid(pl.x,ny,pl.w,pl.h)){
    const r=Math.floor(ny/TS);ny=(r+1)*TS;pl.vy=0;
    const cx=pl.x+pl.w/2;const c=Math.floor(cx/TS);const cands=[c,Math.floor(pl.x/TS),Math.floor((pl.x+pl.w-1)/TS)].filter(cc=>solidAt(cc,r));
    if(cands.length)bumpTile(cands[0],r);
  }
  pl.y=ny;
  if(!wasGround&&pl.ground&&vyIn>2.2){const k=Math.min(1,(vyIn-2)/5);pl.sqx=1+.3*k;pl.sqy=1-.25*k;dust(pl.x+2,pl.y+pl.h,-1);dust(pl.x+8,pl.y+pl.h,1);if(vyIn>4)sfx.land();}
  pl.sqx+=(1-pl.sqx)*.25;pl.sqy+=(1-pl.sqy)*.25;if(Math.abs(pl.sqx-1)<.02&&Math.abs(pl.sqy-1)<.02)pl.sqx=pl.sqy=1;
  if(pl.ground&&Math.abs(pl.vx)>1.7&&tick%10===0)dust(pl.x+5-pl.face*5,pl.y+pl.h,-pl.face*.5);
  if(pl.y>ROWS*TS+8)killPlayer();
  if(at(Math.floor((pl.x+pl.w/2)/TS),Math.floor((pl.y+pl.h-3)/TS))==='~'){pixels(pl.x+5,pl.y+pl.h,14,2.6,[LB,WH,CY],.2,2);ring(pl.x+5,pl.y+pl.h,WH,1.8,14);sfx.splash();killPlayer();}
  // camera with a little look-ahead
  pl.look+=(pl.face*18-pl.look)*.04;
  const target=pl.x-130+pl.look;camX+=(target-camX)*.12;camX=Math.max(0,Math.min(levelW*TS-W,camX));
  // entities
  const pbox={x:pl.x,y:pl.y,w:pl.w,h:pl.h};
  for(const e of entities){
    if(e.dead){
      if(e.t==='owl'||e.t==='wasp'){e.vy+=GRAV;e.y+=e.vy;e.dead++;if(e.y>ROWS*TS+20)e.dead=999;}
      continue;
    }
    if(e.x<camX-64||e.x>camX+W+64){if(e.t!=='gemrise')continue;}
    if(e.t==='owl'){
      e.f=(e.f+.12)%4;const ahead=e.vx>0?e.x+e.w+1:e.x-1;
      const rBelow=Math.floor((e.y+e.h+1)/TS),cAhead=Math.floor(ahead/TS);
      if(solidAt(cAhead,Math.floor((e.y+e.h-1)/TS))||!solidAt(cAhead,rBelow))e.vx=-e.vx;
      e.x+=e.vx;e.vy+=GRAV;let ey=e.y+e.vy;if(e.vy>0&&rectSolid(e.x,ey,e.w,e.h)){ey=Math.floor((ey+e.h)/TS)*TS-e.h;e.vy=0;}e.y=ey;
      if(e.y>ROWS*TS)e.dead=999;
    }else if(e.t==='wasp'){
      e.f=(e.f+.35)%2;e.ph+=.08;e.x+=e.vx;e.y=e.base+Math.sin(e.ph)*22;
      if(rectSolid(e.x+(e.vx>0?e.w:0),e.y,1,e.h)||e.x<0||e.x>levelW*TS-16)e.vx=-e.vx;
    }else if(e.t==='gemrise'){
      e.y+=e.vy;e.vy+=.06;if(--e.life<=0){e.dead=999;sparks(e.x+4,e.y+3,5,1.2);}continue;
    }else if(e.t==='power'){
      e.x+=e.vx;if(rectSolid(e.x+(e.vx>0?e.w:0),e.y,1,e.h))e.vx=-e.vx;e.vy=(e.vy||0)+GRAV;let ey=e.y+e.vy;if(e.vy>0&&rectSolid(e.x,ey,e.w,e.h)){ey=Math.floor((ey+e.h)/TS)*TS-e.h;e.vy=0;}e.y=ey;
      if(e.y>ROWS*TS+16)e.dead=999;
      if(overlap(pbox,e)){e.dead=999;pl.punk=true;addScore(500);floater(e.x+4,e.y,'PUNK!',YE,true);sfx.power();
        sparks(pl.x+5,pl.y+10,16,2.4,[YE,WH,LR,RD]);ring(pl.x+5,pl.y+11,YE,2,16);ring(pl.x+5,pl.y+11,RD,1.3,20);borderFlash([YE,RD,LR,WH,PU],36);}
      continue;
    }
    if(e.t==='gem'){if(Math.random()<.012)part({k:'spark',x:e.x+Math.random()*8,y:e.y+Math.random()*6,vx:0,vy:-.1,g:0,d:1,t:14,max:14,cyc:[WH,CY]});
      if(overlap(pbox,e)){e.dead=999;addDiamond(e.x,e.y);}continue;}
    if(e.t==='door'){if(Math.random()<.06)part({k:'spark',x:e.x+Math.random()*16,y:e.y+Math.random()*32,vx:0,vy:-.25,g:0,d:1,t:20,max:20,cyc:[YE,WH,OR]});
      if(overlap(pbox,{x:e.x+4,y:e.y,w:8,h:e.h})&&pl.ground){startClear(e);}continue;}
    if(overlap(pbox,e)){
      if(pl.vy>0&&pl.y+pl.h-e.y<10){e.dead=1;e.vy=-3;pl.vy=-4.2;addScore(100);sfx.stomp();floater(e.x+7,e.y-6,'100',WH);
        puff(e.x+7,e.y+4,7,1.3);ring(e.x+7,e.y+6,WH,1.6,12);pl.sqx=1.25;pl.sqy=.8;addShake(2);}
      else hurt();
    }
  }
  entities=entities.filter(e=>e.dead<200);
  updateFx();
  pl.anim+=Math.abs(pl.vx)*.12;
}
function startClear(door){
  state='clear';stateT=0;musicOn=false;sfx.clear();pl.vx=0;
  clr={door,bonus:Math.floor(timeLeft),left:Math.floor(timeLeft),done:0,fw:0};
  borderLoad(70);sparks(door.x+8,door.y+16,20,2.4,[YE,WH,OR]);ring(door.x+8,door.y+16,YE,2,18);
}
function updateClear(){
  const d=clr.door;
  if(stateT<.7){pl.x+=((d.x+3)-pl.x)*.15;pl.anim+=.25;}
  else if(!pl.hidden){pl.hidden=true;sparks(d.x+8,d.y+20,14,1.8,[YE,WH]);puff(d.x+8,d.y+30,5,.8);}
  if(stateT>1&&clr.left>0){const k=Math.min(clr.left,4);clr.left-=k;timeLeft=Math.max(0,timeLeft-k);addScore(k*10);if(tick%3===0)sfx.tick();if(!clr.left){clr.done=stateT;timeLeft=0;}}
  if(stateT>1&&clr.bonus===0&&!clr.done)clr.done=stateT;
  clr.fw-=1;if(clr.fw<=0&&stateT>.4){clr.fw=22+Math.random()*16;firework(camX+40+Math.random()*(W-80),30+Math.random()*60);if(Math.random()<.6)tone(90+Math.random()*60,.2,'triangle',.05);}
  updateFx();
  if(clr.done&&stateT>clr.done+1.6){
    level++;
    if(level>MAXL){state='win';stateT=0;borderBase=BL;particles=[];rings=[];musicOn=false;sfx.clear();}
    else{loadLevel(level);state='play';stateT=0;startMusic();showBanner('LEVEL '+level,STAGES[(level-1)%STAGES.length]);}
  }
}
// title screen scene: the heroine runs through an endless meadow and hops over owls
const ts={cam:0,y:138,vy:0,owl:{x:420,f:0},gem:{x:420,y:124,on:true},anim:0};
function updateTitle(){
  ts.cam+=1;ts.anim+=.25;
  const gx=ts.cam+34;
  ts.owl.x-=.45;ts.owl.f=(ts.owl.f+.12)%4;
  if(ts.owl.x<ts.cam-40){ts.owl.x=ts.cam+W+40+Math.random()*160;ts.gem.x=ts.owl.x+3;ts.gem.on=true;}
  if(ts.y>=138&&ts.vy===0&&ts.owl.x-gx<17&&ts.owl.x-gx>0){ts.vy=-3.4;dust(gx+5,160,0);}
  if(ts.vy!==0||ts.y<138){ts.vy+=.3;ts.y+=ts.vy;if(ts.y>=138){ts.y=138;ts.vy=0;dust(gx+2,160,-1);dust(gx+8,160,1);}}
  if(ts.gem.on){ts.gem.x=ts.owl.x+3;if(Math.abs(ts.gem.x+4-(gx+5))<12&&Math.abs(ts.gem.y+3-(ts.y+6))<14){ts.gem.on=false;sparks(ts.gem.x+4,ts.gem.y+3,10,1.8);ring(ts.gem.x+4,ts.gem.y+3,CY,1.4,10);if(AC)sfx.gem();}}

}

// ═══════════════════════════ RENDER ═══════════════════════════
let sx=0,sy=0;
function worldTiles(cam){
  const cp=Math.round(cam*Z),c0=Math.floor(cam/TS),c1=c0+W/TS+1;
  for(let r=0;r<ROWS;r++)for(let c=c0;c<=c1;c++){
    const ch=at(c,r);if(ch===' ')continue;
    let oy=0;for(const b of bumps)if(b.c===c&&b.r===r)oy=-Math.round(Math.sin(b.t/10*Math.PI)*10);
    const t=tileFor(ch,c,r);if(t)ctx.drawImage(t,c*32-cp+sx,HP+r*32+oy+sy);
  }
}
const hx=(x,cam)=>Math.round((x-cam)*Z)+sx,hy=y=>Math.round(y*Z)+HP+sy;
function drawPlayer(cam){
  if(pl.hidden)return;
  if(pl.inv>0&&!pl.dead&&Math.floor(tick/3)%2===0)return;
  const S=pl.punk?PUNKG:GIRL;let s,flip=pl.face<0;
  if(pl.dead)s=S.dead;
  else if(state==='clear')s=S.run[Math.floor(pl.anim*2)%8];
  else if(!pl.ground)s=pl.vy<-.5?S.jump:S.fall;
  else if(pl.skid>0){s=S.skid;flip=pl.vx<0;}
  else if(Math.abs(pl.vx)>.3)s=S.run[Math.floor(pl.anim*2)%8];
  else s=(tick%200)<7?S.blink:S.idle[Math.floor(tick/32)%2];
  drawSq(s,hx(pl.x-pl.ox,cam),hy(pl.y-2),flip,pl.dead?1:pl.sqx,pl.dead?1:pl.sqy);
}
function drawEntities(cam){
  for(const e of entities){
    if(e.dead>=200)continue;
    const ex=hx(e.x,cam),ey=hy(e.y);
    if(ex<-70||ex>SW+70)continue;
    if(e.t==='gem'||e.t==='gemrise'){const f=(Math.floor(tick/5)+((e.x/16)|0)*5)%18;drawS(DIA[Math.min(7,f)],ex,ey-1+(e.t==='gem'?Math.round(Math.sin(tick*.08+e.x)*1.2):0));}
    else if(e.t==='door')drawS(state==='clear'?DOOR_OPEN:DOOR,ex,ey);
    else if(e.t==='power')drawS(BUB[Math.floor(tick/8)%4],ex-4,ey-4);
    else if(e.t==='owl'){if(e.dead){ctx.save();ctx.translate(ex-2,ey+30);ctx.scale(1,-1);ctx.drawImage(OWLD.c,0,0);ctx.restore();}else drawS(OWL[Math.floor(e.f)],ex,ey,e.vx>0);}
    else if(e.t==='wasp'){const s=WASP[Math.floor(e.f)];if(e.dead){ctx.save();ctx.translate(ex-4,ey+16);ctx.scale(1,-1);ctx.drawImage(s.c,0,0);ctx.restore();}else drawS(s,ex-2,ey-4,e.vx<0);}
  }
}
function drawParticles(cam){
  for(const p of particles){
    const x=hx(p.x,cam),y=hy(p.y);if(x<-30||x>SW+30||y<-30||y>SH+30)continue;
    if(p.k!=='puff'&&p.t<p.max*.3&&(tick&1))continue;
    if(p.k==='p')fillH(p.c,x,y,p.s,p.s);
    else if(p.k==='chunk'){if((tick>>2)&1){fillH(K,x-4,y-3,8,6);fillH(p.c,x-3,y-2,6,4);fillH(p.c2,x-3,y-2,6,1);}else{fillH(K,x-3,y-4,6,8);fillH(p.c,x-2,y-3,4,6);fillH(p.c2,x-2,y-3,1,6);}}
    else if(p.k==='spark'){const c=p.cyc[(p.t>>1)%p.cyc.length],L=p.t>p.max*.5?4:2;fillH(c,x,y,2,2);fillH(c,x-L,y,L,2);fillH(c,x+2,y,L,2);fillH(c,x,y-L,2,L);fillH(c,x,y+2,2,L);}
    else if(p.k==='puff'){const pr=1-p.t/p.max;let i=Math.min(PUFF.length-1,Math.floor(Math.sin(pr*Math.PI)*PUFF.length));if(p.sm)i=Math.min(i,2);const s=PUFF[i];ctx.drawImage(s,x-(s.width>>1),y-(s.height>>1));}
  }
  for(const r of rings){if(r.t<r.max*.3&&(tick&1))continue;const x=hx(r.x,cam),y=hy(r.y),R=r.r*Z,n=Math.max(10,Math.round(R*.6));
    for(let i=0;i<n;i++){const a=i/n*Math.PI*2;fillH(r.c,Math.round(x+Math.cos(a)*R)-1,Math.round(y+Math.sin(a)*R)-1,2,2);}}
  for(const f of floaters){if(f.t<14&&(tick&2))continue;const big=f.max-f.t<5,sc=big?3:2;const x=hx(f.x,cam)-(tw(f.s,sc)>>1),y=hy(f.y)-(big?4:0);textS(f.s,x,y,f.c,sc);}
}
function renderWorld(){
  const cam=camX;
  sx=shake>0?Math.round((Math.random()-.5)*shake*2):0;sy=shake>0?Math.round((Math.random()-.5)*shake*2):0;
  drawBG(theme,cam,rt);
  worldTiles(cam);
  drawEntities(cam);
  drawPlayer(cam);
  drawParticles(cam);
  sx=sy=0;
  if(wipe>0){const h=Math.ceil(16*wipe);for(let y=HP;y<SH;y+=16)fillH(K,0,y,SW,h);}
  renderBanner();
}
const RASTER=[BL,LB,CY,WH,CY,LB,BL,PU,LR,YE,LR,PU];
function rasterLine(y,h){const o=Math.floor(rt*40);for(let x=0;x<SW;x+=16)fillH(RASTER[((x>>4)+o)%RASTER.length],x,y,16,h);}
function renderHUD(){
  fillH(K,0,0,SW,HP);
  drawS(DIA[Math.min(7,Math.floor(tick/5)%14)],3,1);
  text(String(diamonds).padStart(3,'0'),24,0,CY);
  text('SCORE',84,0,LGY);text(String(score).padStart(6,'0'),172,0,WH);
  text('LV'+level,284,0,YE);
  text(CLOCK,356,0,LGY);text(String(Math.ceil(timeLeft)).padStart(3,'0'),374,0,timeLeft<30&&Math.floor(tick/8)%2?RD:WH);
  text('♥',448,0,LR);text(String(lives),466,0,WH);
  text(SEC.g,560,0,SEC.c);
  text(muted?SPKX:SPK,596,0,muted?RD:LGY);
  rasterLine(HP-2,2);
}
function panel(x,y,w,h,face){fillH(K,x,y,w,h);fillH(LGY,x+2,y+2,w-4,h-4);fillH(WH,x+2,y+2,w-4,2);fillH(WH,x+2,y+2,2,h-4);fillH(GY,x+2,y+h-4,w-4,2);fillH(GY,x+w-4,y+2,2,h-4);fillH(K,x+6,y+6,w-12,h-12);fillH(face,x+8,y+8,w-16,h-16);}
function renderBanner(){
  if(!banner)return;const t=banner.t,m=banner.max;
  const k=t<10?t/10:t>m-12?(m-t)/12:1;if(k<=0)return;
  const cy=112,hh=Math.round(34*k);
  fillH(K,0,cy-hh-2,SW,hh*2+4);fillH(BL,0,cy-hh,SW,hh*2);
  for(let i=0;i<7;i++){const c=[BL,LB,CY,WH,CY,LB,BL][i];fillH(c,0,cy-hh+i,SW,1);fillH(c,0,cy+hh-1-i,SW,1);}
  if(k>.9){const slide=Math.max(0,(14-t)*40);ctx.save();ctx.translate(-slide,0);
    waveText(banner.a,SW/2,cy-24,3,i=>[banner.c,WH,banner.c,YE][(i+(tick>>2))%4],3,rt);
    ctx.restore();textC(banner.b,cy+8,CY,2,K);}
}
function renderTitle(){
  const cam=ts.cam;
  drawBG(THEMES[0],cam,rt);
  // copper-style raster bars behind the logo
  const bars=[[BL,LB,CY,WH,CY,LB,BL],[PU,LR,YE,WH,YE,LR,PU],[GR,LG,WH,WH,LG,GR,DG]];
  for(let b=0;b<3;b++){const y=Math.round(40+Math.sin(rt*1.7+b*2.1)*24);for(let i=0;i<7;i++)fillH(bars[b][i],0,y+i*2,SW,2);}
  // logo with cycling raster colours and bevelled blocks
  const LC=[RD,LR,OR,YE,WH,YE,OR,LR];const s='CERT SISTERS',sc=5,cw=40,x0=(SW-s.length*cw)>>1,o=Math.floor(rt*12);
  for(let pass=0;pass<2;pass++)for(let i=0;i<s.length;i++){const rows=FONT[s[i]];if(s[i]===' ')continue;const lx=x0+i*cw,ly=26+Math.round(Math.sin(rt*3+i*.5)*4);
    for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(rows[r]&(0x80>>c)){
      const X=lx+c*sc,Y=ly+r*sc;
      if(pass===0){fillH(K,X+3,Y+3,sc,sc);fillH(BR,X+2,Y+2,sc,sc);}
      else{fillH(LC[(r+o+i)%LC.length],X,Y,sc,sc);if(!(r>0&&rows[r-1]&(0x80>>c)))fillH(WH,X,Y,sc,1);if(!(c>0&&rows[r]&(0x80>>(c-1))))fillH(WH,X,Y,1,sc);}}}
  textC('THE GREAT PKI ADVENTURE',76,LGY,2,K);
  // C64-blue text window with raster edges
  fillH(BL,24,98,592,160);ctx.drawImage(DITH,24,250,592,8,24,250,592,8);
  {const o2=Math.floor(rt*40);for(let x=24;x<616;x+=16){const c=RASTER[((x>>4)+o2)%RASTER.length];fillH(c,x,96,16,2);fillH(c,x,258,16,2);}}
  // greeting: big, bouncing, colour-cycled
  const g=norm(GREETING),gsc=g.length<=18?4:g.length<=26?3:g.length<=40?2:1;
  const GC=[WH,YE,LG,CY,LR,YE];waveText(g,SW/2,112,gsc,i=>GC[(i+Math.floor(rt*7))%GC.length],3,rt);
  const hi=HOST_INFO.indexOf(':');
  if(hi>-1){const a=HOST_INFO.slice(0,hi+1),b=HOST_INFO.slice(hi+1).trim();const tot=norm(a).length+1+norm(b).length;const x=Math.floor((SW-tot*16)/2);textS(a,x,156,LGY);textS(b,x+(norm(a).length+1)*16,156,LG);}
  else textC(HOST_INFO,156,LG,2,K);
  // security badge derived from the page's own origin
  const bw=tw(SEC.txt)+44,bx=(SW-bw)>>1;fillH(K,bx,178,bw,24);fillH(SEC.c,bx+2,180,bw-4,20);fillH(K,bx+4,182,bw-8,16);text(SEC.g,bx+10,182,SEC.c);text(SEC.txt,bx+32,182,SEC.c);
  textC('HI-SCORE '+String(best).padStart(6,'0'),210,CY,2,K);
  if(Math.floor(rt*2)%2===0)textC(coarse?'TAP TO PLAY':'PRESS SPACE OR TAP TO PLAY',234,WH,2,K);
  // ground and actors
  const cp=Math.round(cam*Z),off=((cp%32)+32)%32;
  for(let x=-off;x<SW;x+=32){ctx.drawImage(groundTile(true,false,false,false),x,HP+320);ctx.drawImage(groundTile(false,true,false,false),x,HP+352);}
  if(ts.gem.on)drawS(DIA[Math.min(7,Math.floor(tick/5)%12)],hx(ts.gem.x,cam),hy(ts.gem.y));
  drawS(OWL[Math.floor(ts.owl.f)],hx(ts.owl.x,cam)-2,hy(146));
  const S=GIRL,air=ts.y<138;drawS(air?(ts.vy<0?S.jump:S.fall):S.run[Math.floor(ts.anim)%8],hx(ts.cam+34-3,cam),hy(ts.y-2),false);
  drawParticles(cam);
  // sine scroller over the bricks
  scroller(SCROLL,372,2);
}
const SCROLL=('     *** CERT SISTERS - THE GREAT PKI ADVENTURE ***     '+norm(GREETING)+'  •  '+norm(HOST_INFO)+
  '  •  COLLECT DIAMONDS, BUMP THE ? BLOCKS AND GRAB THE PUNK BUBBLE FROM THE ! BLOCKS TO SMASH RED BRICKS.'+
  '  STOMP THE EXPIRED OWLS, DODGE THE ROGUE WASPS AND DELIVER THE CERTIFICATE TO THE LOCKED DOOR BEFORE THE TIMER RUNS OUT.'+
  '  ARROWS MOVE • SPACE JUMP • P PAUSE • M SOUND  •  GREETINGS TO EVERY PKI ADMIN WHO EVER RENEWED A CERT AT 4:59 PM ON A FRIDAY...     ');
function scroller(msg,y,sc){const cw=8*sc,len=msg.length*cw,off=(rt*110)%(len+SW);const CYC=[WH,YE,LG,CY,LB,LR];
  for(let pass=0;pass<2;pass++)for(let i=0;i<msg.length;i++){const x=Math.round(SW-off+i*cw);if(x<-cw||x>SW)continue;const ch=msg[i];if(ch===' ')continue;
    const yy=y+Math.round(Math.sin(rt*4+x*.018)*7);if(pass===0){ctx.drawImage(glyph(ch,K,sc),x+2,yy+2);}else ctx.drawImage(glyph(ch,CYC[Math.floor((x+rt*200)/64)%CYC.length],sc),x,yy);}}
function renderClear(){
  renderWorld();renderHUD();
  const t=stateT;if(t<.9)return;
  const k=Math.min(1,(t-.9)*5);const w=Math.round(460*k),h=Math.round(170*k),x=(SW-w)>>1,y=100+((170-h)>>1);
  ctx.drawImage(DITH,0,HP,SW,SH-HP,0,HP,SW,SH-HP);
  panel(x,y,w,h,BL);if(k<1)return;
  for(let i=0;i<7;i++)fillH([BL,LB,CY,WH,CY,LB,BL][i],x+8,y+8+i*2,w-16,2);
  waveText('LEVEL '+level+' CLEAR',SW/2,y+30,3,i=>[YE,WH,LG,CY][(i+(tick>>2))%4],3,rt);
  const shown=(clr.bonus-clr.left)*10;
  text('TIME BONUS',x+40,y+76,CY);text(String(shown).padStart(5,'0'),x+w-40-80,y+76,WH);
  text('DIAMONDS',x+40,y+98,CY);drawS(DIA[Math.floor(tick/5)%8],x+w-40-110,y+99);text(String(diamonds).padStart(5,'0'),x+w-40-80,y+98,WH);
  text('SCORE',x+40,y+120,CY);text(String(score).padStart(6,'0'),x+w-40-96,y+120,YE);
  if(clr.done&&Math.floor(rt*3)%2===0)textC(level>=MAXL?'ALL CERTS DELIVERED!':'GET READY...',y+144,WH);
}
const bounce=p=>{const n=7.5625,d=2.75;if(p<1/d)return n*p*p;if(p<2/d)return n*(p-=1.5/d)*p+.75;if(p<2.5/d)return n*(p-=2.25/d)*p+.9375;return n*(p-=2.625/d)*p+.984375;};
function renderOver(){
  renderWorld();renderHUD();
  ctx.drawImage(DITH,0,HP,SW,SH-HP,0,HP,SW,SH-HP);
  const s='GAME OVER',sc=6,cw=48,x0=(SW-s.length*cw)>>1;
  for(let pass=0;pass<2;pass++)for(let i=0;i<s.length;i++){if(s[i]===' ')continue;const p=Math.max(0,Math.min(1,(stateT*60-i*5)/40));if(p<=0)continue;
    const y=Math.round(90-(1-bounce(p))*160);const rows=FONT[s[i]];
    for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(rows[r]&(0x80>>c)){const X=x0+i*cw+c*sc,Y=y+r*sc;
      if(pass===0)fillH(K,X+4,Y+4,sc,sc);else{fillH([WH,LGY,LR,LR,RD,RD,BR,BR][r],X,Y,sc,sc);}}}
  if(stateT>.9){
    textC('SCORE '+String(score).padStart(6,'0'),160,YE,3,K);
    if(score>bestAtStart&&score>0&&Math.floor(rt*4)%2===0)textC('NEW HI-SCORE!',196,LG,2,K);
    const g=norm(GREETING);textC(g,224,[WH,CY,LB,LR,YE,LG][Math.floor(rt*7)%6],g.length<=36?2:1,K);
  }
  if(stateT>1.5&&Math.floor(rt*2)%2===0)textC('SPACE / TAP FOR TITLE',262,WH,2,K);
}
function renderPause(){
  renderWorld();renderHUD();
  ctx.drawImage(DITH,0,HP,SW,SH-HP,0,HP,SW,SH-HP);
  panel(130,130,380,110,BL);
  for(let i=0;i<7;i++)fillH([BL,LB,CY,WH,CY,LB,BL][i],138,138+i*2,364,2);
  waveText('PAUSED',SW/2,162,4,i=>[WH,CY,YE][(i+(tick>>3))%3],2,rt);
  if(Math.floor(rt*2)%2===0)textC(coarse?'TAP TO RESUME':'P OR SPACE TO RESUME',208,WH);
}
function renderWin(){
  const cam=rt*20;
  drawBG(THEMES[2],cam,rt);
  const cp=Math.round(cam*Z),off=((cp%32)+32)%32;
  for(let x=-off;x<SW;x+=32){ctx.drawImage(groundTile(true,false,false,false),x,HP+320);ctx.drawImage(groundTile(false,true,false,false),x,HP+352);}
  if(tick%26===0)firework(cam+30+Math.random()*(W-60),24+Math.random()*60);
  drawParticles(cam);
  fillH(K,0,0,SW,HP);rasterLine(HP-2,2);
  const s='CERT DELIVERED!';waveText(s,SW/2,30,4,i=>[YE,WH,LG,CY,LR][(i+(tick>>2))%5],4,rt);
  textC('YOU CLEARED ALL LEVELS',82,LG,2,K);
  textC('THE CLOUD SERVER IS SECURE',104,CY,2,K);
  textC('SCORE '+String(score).padStart(6,'0'),136,WH,3,K);
  textC('DIAMONDS '+diamonds,172,CY,2,K);
  const g=norm(GREETING);waveText(g,SW/2,200,g.length<=26?3:2,i=>[WH,CY,LB,LR,YE,LG][(i+Math.floor(rt*7))%6],3,rt);
  drawS(DOOR_OPEN,352,HP+256);
  const S=pl.punk?PUNKG:GIRL;drawS(S.win[Math.floor(rt*3)%2],300,HP+272,false);
  if(stateT>1.5&&Math.floor(rt*2)%2===0)textC('SPACE / TAP FOR TITLE',246,WH,2,K);
}

// ═══════════════════════════ SECURITY BADGE ═══════════════════════════
const SEC=(()=>{const host=norm(location.host||'').slice(0,28);
  if(location.protocol==='https:')return {g:LOCK,c:LG,txt:'HTTPS '+host};
  if(location.protocol==='http:')return {g:UNLOCK,c:LR,txt:'NOT SECURE '+host};
  return {g:UNLOCK,c:LGY,txt:'LOCAL FILE'};})();

// ═══════════════════════════ LOOP ═══════════════════════════
let last=performance.now(),acc=0,rt=0;const STEP=1/60;
function frame(now){let dt=Math.min(.1,(now-last)/1000);last=now;acc+=dt;while(acc>=STEP){step(STEP);acc-=STEP;}render();requestAnimationFrame(frame);}
function step(dt){
  rt+=dt;
  if(state==='pause'){updateBorder();return;}
  stateT+=dt;tick++;
  if(wipe>0)wipe=Math.max(0,wipe-.05);
  if(banner&&++banner.t>=banner.max)banner=null;
  if(state==='play')updatePlay(dt);
  else if(state==='clear')updateClear();
  else if(state==='title')updateTitle();
  else updateFx();
  updateBorder();
  music();
}
function render(){
  if(state==='title')renderTitle();
  else if(state==='play'){renderWorld();renderHUD();}
  else if(state==='clear')renderClear();
  else if(state==='over')renderOver();
  else if(state==='pause')renderPause();
  else renderWin();
}
function fit(){
  const vw=innerWidth,vh=innerHeight,m=vw<700||vh<500?8:40;
  let s=Math.min((vw-(m>8?0:m))/SW,(vh-m)/SH);if(s>=1)s=Math.floor(s*2)/2;
  cv.style.width=Math.floor(SW*s)+'px';cv.style.height=Math.floor(SH*s)+'px';
}
addEventListener('resize',fit);fit();paintButtons();requestAnimationFrame(frame);
if(QS.has('debug'))window.__cs={
  get s(){return {state,level,lives,score,diamonds,x:pl.x,y:pl.y,ground:pl.ground,dead:pl.dead,levelW,ents:entities.length,punk:pl.punk,time:Math.ceil(timeLeft),parts:particles.length,camX,muted,best};},
  map:()=>map.map(r=>r.join('')),door:()=>entities.find(e=>e.t==='door'),
  ents:()=>entities.filter(e=>!e.dead&&(e.t==='owl'||e.t==='wasp')).map(e=>({t:e.t,x:e.x,y:e.y})),
  pl,keys,jump:()=>{jumpEdge=true;},load:n=>{level=n;loadLevel(n);state='play';stateT=0;},kill:()=>killPlayer(),
  start:()=>{if(state==='title')startGame();},punk:()=>{pl.punk=true;},
  tp:(x,y)=>{pl.x=x;if(y!=null)pl.y=y;camX=Math.max(0,Math.min(levelW*TS-W,x-130));},
  clear:()=>{const d=entities.find(e=>e.t==='door');if(d){pl.x=d.x+3;pl.y=d.y+10;pl.vy=0;pl.ground=true;camX=Math.max(0,Math.min(levelW*TS-W,pl.x-130));startClear(d);}},
  over:()=>{lives=1;killPlayer();},win:()=>{state='win';stateT=0;borderBase=BL;},
  fx:(x,y)=>{firework(x,y);chunks(x,y,[RD,LR]);puff(x,y,6,1.2);sparks(x,y,10,2);},
  pause:()=>togglePause(),time:t=>{timeLeft=t;}
};
})();
