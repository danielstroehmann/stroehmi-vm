<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#111;--paper:#f3f0e7;--red:#d3202a;--cyan:#8fe3ff;--green:#39ff14;
  --jp:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;

}
html,body{height:100%;overflow:hidden}
html{background:var(--paper)}
body{
  color:var(--ink);font-family:var(--jp);font-weight:500;background:var(--paper);
  background-image:radial-gradient(rgba(0,0,0,.07) 1px,transparent 1.3px);background-size:7px 7px;
}
.app{height:100vh;height:100dvh;max-width:1680px;margin:0 auto;display:flex;flex-direction:column;

/* ── MAGAZINE HEADER ─────────────────────────────────────────── */
.mag{
  display:grid;grid-template-columns:auto 1fr auto auto;gap:clamp(.5rem,1.6vw,1.3rem);align-items:center;flex:none;
  border:4px solid var(--ink);background:#fff;box-shadow:6px 6px 0 var(--ink);padding:.4rem .9rem;
}
.mag-logo{
  background:var(--red);color:#fff;font-family:var(--comic);font-size:clamp(.95rem,2vw,1.5rem);line-height:.95;
  padding:.35rem .55rem .3rem;border:3px solid var(--ink);transform:rotate(-2.5deg);text-align:center;letter-spacing:.05em;
  box-shadow:3px 3px 0 var(--ink);
}
.mag-logo small{display:block;font-family:var(--jp);font-weight:900;font-size:.52em;letter-spacing:.35em;margin-bottom:.15em}
.mag-title{min-width:0}
.mag-title h1{font-family:var(--comic);font-size:clamp(1.5rem,3.4vw,2.6rem);letter-spacing:.06em;line-height:1;font-weight:400;white-space:nowrap}
.mag-title h1 span{color:var(--red)}
.mag-title h1 .kana{font-family:var(--jp);font-weight:900;font-size:.5em;vertical-align:middle;color:var(--ink);letter-spacing:.02em}
.mag-title h1 .mv{font-size:.5em;background:var(--ink);color:#fff;padding:.08em .35em .02em;vertical-align:middle;letter-spacing:.12em;margin-left:.3em}
.mag-title .sub{font-weight:900;font-size:clamp(.6rem,1.15vw,.85rem);margin-top:.2rem;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mag-title .sub em{font-style:normal;background:var(--ink);color:#fff;padding:.05em .45em;margin-right:.4em}
.greet{position:relative;justify-self:end}
.greet-bub{
  position:relative;background:#fff;border:3px solid var(--ink);border-radius:1.4em;padding:.3em .95em .2em;
  font-family:var(--comic);font-size:clamp(1.2rem,2.7vw,2.2rem);letter-spacing:.08em;line-height:1;color:var(--red);
  box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg);white-space:nowrap;min-width:3.2em;text-align:center;
}
.greet-bub::after{content:'';position:absolute;width:13px;height:13px;background:#fff;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(45deg);bottom:-9px;left:24%}

.tls.bad{background:var(--red);color:#fff}.tls.bad i{background:#fff}
.tls.loc i{background:#e0a100}

.stage{position:relative;flex:1 1 auto;min-height:0;border:4px solid var(--ink);box-shadow:7px 7px 0 var(--ink);background:#1b1b1b;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}

.stage.is-paused .paused{display:block}
.fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:.6rem;background:#fff;text-align:center;padding:1rem;z-index:4}

.no2d .fallback{display:flex}

.ctrl button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.ctrl .snd.on{background:var(--red);color:#fff}
.idx{flex:1;display:flex;gap:4px;min-width:0}

.idx button.cur{background:var(--ink);color:#fff}
.idx button .jp{font-family:var(--jp);font-weight:900;font-size:.8em}

/* ── FOOTER ────────────────────────────────────────────────── */
.foot{
  display:flex;flex-wrap:wrap;gap:.3rem 1.4rem;justify-content:space-between;align-items:center;flex:none;

  .idx .jp{display:none}
  .foot{padding:.3rem .6rem;font-size:.54rem;gap:.15rem .8rem;justify-content:center}
  .foot .brand{display:none}
}
@media (max-height:520px) and (min-width:761px){
  .mag{padding:.2rem .7rem}.mag-meta .clock{font-size:1.3em}.foot{display:none}
}

<script>
(function(){
'use strict';
/* =========================================================================
   CERT-MAN · THE MOVIE
   A procedurally inked short film. Everything on screen is a pure function
   of the film time T, so any moment can be sought (see ?debug, window.__mg).
   Pipeline: Canvas 2D draws line art, flat greys, red and a few colours into
   an offscreen "ink" canvas. A WebGL pass then prints it: greys become
   screentone (45° halftone), line edges stay crisp, lines boil on twos,
   paper fibre, ink density and grain are added. Without WebGL the ink
   canvas is shown directly.
   ========================================================================= */
const $=id=>document.getElementById(id);
const DEBUG=/[?&]debug\b/.test(location.search);
const RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const INK='#111',WH='#fff',RED='#d3202a',CYAN='#8fe3ff',GREEN='#39ff14';
const JPF='"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif';
const CMF='Bangers,"Arial Black",Impact,sans-serif';

/* ---------- math ---------- */
const TAU=Math.PI*2,PI=Math.PI;
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const ss=t=>{t=clamp(t);return t*t*(3-2*t);};
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const eo=t=>{t=clamp(t);return 1-Math.pow(1-t,3);};
const ei=t=>{t=clamp(t);return t*t*t;};
const eo2=t=>{t=clamp(t);return 1-(1-t)*(1-t);};
const eback=t=>{t=clamp(t);const a=1.9,b=a+1;return 1+b*Math.pow(t-1,3)+a*Math.pow(t-1,2);};
const seg=(t,a,d)=>clamp((t-a)/d);
const win=(t,a,b,f=.2)=>clamp((t-a)/f)*clamp((b-t)/f);
function h1(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);}
function nz(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return (lerp(h1(i),h1(i+1),u))*2-1;}
function K(t,a,e=eio){if(t<=a[0])return a[1];for(let i=0;i<a.length-2;i+=2){if(t<=a[i+2])return lerp(a[i+1],a[i+3],e((t-a[i])/(a[i+2]-a[i])));}return a[a.length-1];}
const GS=[];for(let i=0;i<=100;i++){const v=Math.round(i*2.55);GS.push('rgb('+v+','+v+','+v+')');}
const G=v=>GS[Math.round(clamp(v)*100)];
const pad=n=>String(n).padStart(2,'0');

/* ---------- canvases ---------- */
const stage=$('stage'),glc=$('film');
const ink=document.createElement('canvas');
let c=ink.getContext('2d');
const MAIN=c;
let W=2,H=2,U=1,quality=1,dprE=1;
const FX={inv:0,flash:0,boil:1};

/* ---------- drawing primitives ---------- */
const PC=new Map();
function P(d){let p=PC.get(d);if(!p){p=new Path2D(d);if(PC.size>4000)PC.clear();PC.set(d,p);}return p;}
function sc(){const m=c.getTransform();return Math.hypot(m.a,m.b)||1;}
// a "pen" width in screen units (U), converted to local units, thickening a little in close-ups
function lwv(w){const S=sc();return w*U*Math.pow(S/U,.42)/S;}
function pxl(px){return px*U/sc();}
function spl(pts,closed=true,p=new Path2D()){
  const n=pts.length>>1;if(n<2)return p;
  const X=i=>closed?pts[((i%n+n)%n)*2]:pts[Math.min(n-1,Math.max(0,i))*2];
  const Y=i=>closed?pts[((i%n+n)%n)*2+1]:pts[Math.min(n-1,Math.max(0,i))*2+1];
  p.moveTo(X(0),Y(0));
  const m=closed?n:n-1;
  for(let i=0;i<m;i++){
    const x0=X(i-1),y0=Y(i-1),x1=X(i),y1=Y(i),x2=X(i+1),y2=Y(i+1),x3=X(i+2),y3=Y(i+2);
    p.bezierCurveTo(x1+(x2-x0)/6,y1+(y2-y0)/6,x2-(x3-x1)/6,y2-(y3-y1)/6,x2,y2);
  }
  if(closed)p.closePath();
  return p;
}
function cub(x0,y0,x1,y1,x2,y2,x3,y3,n=14){const o=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;o.push(u*u*u*x0+3*u*u*t*x1+3*u*t*t*x2+t*t*t*x3,u*u*u*y0+3*u*u*t*y1+3*u*t*t*y2+t*t*t*y3);}return o;}
function qd(x0,y0,x1,y1,x2,y2,n=10){const o=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;o.push(u*u*x0+2*u*t*x1+t*t*x2,u*u*y0+2*u*t*y1+t*t*y2);}return o;}
// tapered brush stroke along a polyline (flat array); w in pen units
function brushP(pts,W0,t0=.25,t1=.75){
  const n=pts.length>>1,L=[],R=[];
  for(let i=0;i<n;i++){
    const a=Math.max(0,i-1),b=Math.min(n-1,i+1);
    let tx=pts[b*2]-pts[a*2],ty=pts[b*2+1]-pts[a*2+1];const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
    const f=n>1?i/(n-1):0;
    let pr=1;if(t0>0&&f<t0)pr=Math.sin(f/t0*PI/2);else if(t1<1&&f>t1)pr=Math.sin((1-f)/(1-t1)*PI/2);
    const hw=W0*.5*Math.max(pr,.06);
    L.push(pts[i*2]-ty*hw,pts[i*2+1]+tx*hw);R.push(pts[i*2]+ty*hw,pts[i*2+1]-tx*hw);
  }
  const p=new Path2D();p.moveTo(L[0],L[1]);
  for(let i=1;i<n;i++)p.lineTo(L[i*2],L[i*2+1]);
  for(let i=n-1;i>=0;i--)p.lineTo(R[i*2],R[i*2+1]);
  p.closePath();return p;
}
function brush(pts,w,t0=.25,t1=.75,col=INK){c.fillStyle=col;c.fill(brushP(pts,lwv(w),t0,t1));}
function line(pts,w,col=INK){c.beginPath();c.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.lineWidth=lwv(w);c.strokeStyle=col;c.lineCap='round';c.lineJoin='round';c.stroke();}
function strokeP(p,w=2.4,col=INK){c.lineWidth=lwv(w);c.strokeStyle=col;c.lineJoin='round';c.lineCap='round';c.stroke(p);}
function fillP(p,f){c.fillStyle=f;c.fill(p);}
// inked part: heavy shadow-side weight, flat fill (optionally cel-shaded) and outline
function part(p,f=WH,sh=null,k=5,w=2.4,wt=1.5,ang=.8){
  if(wt>0){const o=lwv(wt);c.save();c.translate(o*Math.cos(ang),o*Math.sin(ang));c.fillStyle=INK;c.fill(p);c.restore();}
  if(sh){c.save();c.clip(p);c.fillStyle=sh;c.fill(p);c.translate(-k*Math.cos(ang),-k*Math.sin(ang));c.fillStyle=f;c.fill(p);c.restore();}
  else{c.fillStyle=f;c.fill(p);}
  if(w>0)strokeP(p,w);
}
function hatch(p,x,y,w,h,ang,gap,wd=1,col=INK){
  c.save();if(p)c.clip(p);let g=lwv(gap);const cx=x+w/2,cy=y+h/2,r=Math.hypot(w,h)/2;
  if(r/g>260)g=r/260;
  const ca=Math.cos(ang),sa=Math.sin(ang);c.beginPath();
  for(let k=-r;k<=r;k+=g){const px=cx-sa*k,py=cy+ca*k;c.moveTo(px-ca*r,py-sa*r);c.lineTo(px+ca*r,py+sa*r);}
  c.lineWidth=lwv(wd);c.strokeStyle=col;c.stroke();c.restore();
}
function limbP(x1,y1,x2,y2,w1,w2,bul=0,side=1){
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,a=Math.atan2(dy,dx);
  const mx=(x1+x2)/2,my=(y1+y2)/2,wm=(w1+w2)/4;
  const bA=side>0?1+bul:1+bul*.35,bB=side>0?1+bul*.35:1+bul;
  const p=new Path2D();
  p.moveTo(x1+nx*w1/2,y1+ny*w1/2);
  p.quadraticCurveTo(mx+nx*(2*wm*bA-wm),my+ny*(2*wm*bA-wm),x2+nx*w2/2,y2+ny*w2/2);
  p.arc(x2,y2,w2/2,a+PI/2,a-PI/2,true);
  p.quadraticCurveTo(mx-nx*(2*wm*bB-wm),my-ny*(2*wm*bB-wm),x1-nx*w1/2,y1-ny*w1/2);
  p.arc(x1,y1,w1/2,a-PI/2,a+PI/2,true);
  p.closePath();return p;
}
function circ(x,y,r){const p=new Path2D();p.arc(x,y,Math.max(r,.01),0,TAU);return p;}
function ell(x,y,rx,ry,rot=0){const p=new Path2D();p.ellipse(x,y,Math.max(rx,.01),Math.max(ry,.01),rot,0,TAU);return p;}
function rectP(x,y,w,h){const p=new Path2D();p.rect(x,y,w,h);return p;}
function poly(a,closed=true){const p=new Path2D();p.moveTo(a[0],a[1]);for(let i=2;i<a.length;i+=2)p.lineTo(a[i],a[i+1]);if(closed)p.closePath();return p;}
function glow(x,y,r,col,a=1){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');c.save();c.globalAlpha=a;c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);c.restore();}
function sparkle(x,y,r,col=WH,w=1.5){const p=poly([x,y-r,x+r*.18,y-r*.18,x+r,y,x+r*.18,y+r*.18,x,y+r,x-r*.18,y+r*.18,x-r,y,x-r*.18,y-r*.18]);c.fillStyle=col;c.fill(p);if(w)strokeP(p,w);}

/* ---------- camera ---------- */
// cam: {x,y,h,r,pw,px,py,sx,sy}  h = visible world height (landscape); portrait keeps pw*h visible width
function camFit(R,cam){
  const a=R.w/R.h,pw=cam.pw||.95;

function toriiTunnel(f,camZ,o={}){
  const vy=-150;
  const g=c.createLinearGradient(0,-900,0,vy+60);g.addColorStop(0,G(.03));g.addColorStop(1,G(.3));c.fillStyle=g;c.fillRect(-3000,-3000,6000,3000+vy+60);

  // hills + path
  fillP(P('M-3000 -120 C-900 -260 -300 -170 0 -150 C300 -170 900 -260 3000 -120 L3000 3000 L-3000 3000 Z'),G(.12));
  const pth=poly([-26,vy,26,vy,900,900,-900,900]);fillP(pth,G(.3));
  c.save();c.clip(pth);for(let i=1;i<40;i++){const d=i*.3+1-((camZ*3)%.3);const y=vy+500/d;if(y>900)continue;line([-900,y,900,y],.8*Math.min(2,3/d),'rgba(0,0,0,.6)');}c.restore();

  const items=[];
  for(let i=0;i<22;i++){const d=1.2+i*.62-camZ;if(d<.35)continue;items.push([d,'t']);}
  for(let i=0;i<10;i++){const d=1.5+i*1.2-camZ;if(d<.4)continue;items.push([d,'l',i]);}
  if(o.extra)for(const e of o.extra)items.push([e.d-camZ,'x',e]);
  items.sort((a,b)=>b[0]-a[0]);
  for(const it of items){const d=it[0],s=1/d,by=vy+500*s;
    if(it[1]==='t'){c.save();c.globalAlpha=1;torii(0,by,640*s,RED);if(d>2.2){c.globalAlpha=clamp((d-2.2)/6)*.85;torii(0,by,640*s,G(.25));}c.restore();}
    else if(it[1]==='l'){const sd=it[2]%2?1:-1;stoneLantern(sd*330*s,by,150*s,1);}
    else{c.save();c.translate(0,by);c.scale(s,s);it[2].fn();c.restore();}
  }
}

  const RIGS={heroFront,heroFly,heroBack,heroHead,heroHeadSide,certCard,padlock};
  if(typeof EXTRA_RIGS!=='undefined')Object.assign(RIGS,EXTRA_RIGS);
  const fs=k=>typeof k==='number'?k:SCN.findIndex(S=>S.key===k);
  window.__mg={
    get t(){return T;},get scene(){return SHOTS[cur.i].sc.key;},get shot(){return SHOTS[cur.i].n;},get shotIndex(){return SHOTS[cur.i].k;},
    get fps(){return Math.round(fps*10)/10;},get quality(){return quality;},get playing(){return playing;},loop:LOOP,
    scenes:SCN.map(S=>({key:S.key,no:S.no,title:S.title,t0:S.t0,d:S.d,shots:S.shots.map(s=>({n:s.n,t0:s.t0,d:s.d}))})),
    seek(t){seek(t);return T;},
    go(sc,sh=0,off){const S=SCN[fs(sc)];if(!S)return -1;const s=S.shots[Math.min(sh,S.shots.length-1)];seek(s.t0+(off===undefined?s.d*.55:off));return T;},
    pause(){setPlaying(false);},play(){setPlaying(true);},
    setQuality(v){qLock=!!v;if(v){quality=v;resize();draw();}},
    frame(){draw();return {t:T,scene:this.scene,shot:this.shot};},
    fontsReady,gl:!!gl,_ink:()=>ink,
    bench(n=10){const t0=performance.now();for(let i=0;i<n;i++){renderFilm(T);c.getImageData(0,0,1,1);}const a=(performance.now()-t0)/n;const t1=performance.now();for(let i=0;i<n;i++)present(T);gl&&gl.finish();return {render2d:+a.toFixed(1),present:+((performance.now()-t1)/n).toFixed(1),W,H};},
    // model sheet: draw rigs in isolation. items: [{fn,x,y,s,r,o}], cam {x,y,h}
    sheet(items,cam={x:0,y:0,h:600},bg='#fff'){
      setPlaying(false);hold=true;const R={x:0,y:0,w:W,h:H};c.setTransform(1,0,0,1,0,0);c.fillStyle=bg;c.fillRect(0,0,W,H);FX.inv=0;FX.flash=0;
      BASE=c.getTransform();TS=0;
      view(R,cam,()=>{for(const it of items){const fn=RIGS[it.fn];if(fn)at(it.x||0,it.y||0,it.r||0,it.s||1,()=>fn(Object.assign({t:1},it.o||{})));}});
      present(0);
    }
  };
}

})();
