const LOCK_CLOSED='\u0001',LOCK_OPEN='\u0002';
const glyphCache=new Map();
function glyph(ch,col,sc){
  const k=ch+'|'+col+'|'+sc;let g=glyphCache.get(k);if(g)return g;
  const rows=FONT[ch]||FONT['?'];g=document.createElement('canvas');g.width=8*sc;g.height=8*sc;
  const x=g.getContext('2d');x.fillStyle=PAL[col];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(rows[r]&(0x80>>c))x.fillRect(c*sc,r*sc,sc,sc);
  glyphCache.set(k,g);return g;
}
function norm(s){return String(s).toUpperCase().replace(/Ä/g,'AE').replace(/Ö/g,'OE').replace(/Ü/g,'UE').replace(/ß/gi,'SS');}
let G=ctx; // current text target
function text(s,x,y,col,sc=2){s=norm(s);const d=8*sc;x=Math.round(x);y=Math.round(y);for(let i=0;i<s.length;i++){const ch=s[i];if(ch!==' ')G.drawImage(glyph(ch,col,sc),x+i*d,y);}}
const tw=(s,sc=2)=>norm(s).length*8*sc;
function textC(s,y,col,sc=2){text(s,Math.floor((W-tw(s,sc))/2),y,col,sc);}
function textR(s,x,y,col,sc=2){text(s,x-tw(s,sc),y,col,sc);}
function textS(s,x,y,col,sc=2,sh=K){text(s,x+sc,y+sc,sh,sc);text(s,x,y,col,sc);}
function textCS(s,y,col,sc=2,sh=K){textS(s,Math.floor((W-tw(s,sc))/2),y,col,sc,sh);}
const fitSc=(s,maxW,maxSc)=>Math.max(1,Math.min(maxSc,Math.floor(maxW/(Math.max(1,norm(s).length)*8))));
// Effect text drawn row by row: raster colours per glyph row, sine wave per char, italic shear and a black outline.
function fxText(s,x,y,sc,colFn,dyFn,italic,outline){
  s=norm(s);const d=8*sc;
  const pass=(ox,oy,cf)=>{
    for(let i=0;i<s.length;i++){
      const ch=s[i];if(ch===' ')continue;
      const bx=Math.round(x+i*d)+ox,by=Math.round(y+(dyFn?dyFn(i):0))+oy;
      for(let r=0;r<8;r++){
        const col=cf(i,r);if(col<0)continue;
        const sx=italic?Math.round((7-r)*italic):0;
        G.drawImage(glyph(ch,col,sc),0,r*sc,d,sc,bx+sx,by+r*sc,d,sc);
      }
    }
  };
  if(outline){const o=outline;for(const [ox,oy] of [[-o,0],[o,0],[0,-o],[0,o],[o,o],[o*2,o*2],[-o,-o],[o,-o],[-o,o]])pass(ox,oy,()=>K);}
  pass(0,0,colFn);
}
function R(col,x,y,w,h){G.fillStyle=PAL[col];G.fillRect(x,y,w,h);}
let borderNow='';

// ═══════════════════════════ PIXEL BUFFER (sprite baking) ═══════════════════════════
function hexRGB(h){const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];}
const P32=PAL.map(h=>{const c=hexRGB(h);return ((255<<24)|(c[2]<<16)|(c[1]<<8)|c[0])>>>0;});
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const bay=(x,y)=>(BAY[(y&3)*4+(x&3)]+.5)/16;
class PB{
  constructor(w,h){this.w=w;this.h=h;this.u=new Uint32Array(w*h);}
  set(x,y,c){x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<this.w&&y<this.h)this.u[y*this.w+x]=P32[c];}
  on(x,y){return x>=0&&y>=0&&x<this.w&&y<this.h&&this.u[y*this.w+x]!==0;}
  rect(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.set(x+i,y+j,c);return this;}
  span(y,x0,x1,c){x0=Math.round(x0);x1=Math.round(x1);for(let i=x0;i<x1;i++)this.set(i,y,c);}
  dith(x,y,ramp,v){const n=ramp.length;let k=Math.floor(v*(n-1)+bay(x,y));this.set(x,y,ramp[k<0?0:k>=n?n-1:k]);}
  // shaded ellipse lit from the top left, ordered dither between ramp steps
  blob(cx,cy,rx,ry,ramp,maxY,wrap){
    for(let j=-Math.ceil(ry);j<=Math.ceil(ry);j++){
      const py=Math.round(cy+j);if(maxY!=null&&py>maxY)continue;
      for(let i=-Math.ceil(rx);i<=Math.ceil(rx);i++){
        const nx=i/rx,ny=j/ry,d=nx*nx+ny*ny;if(d>1)continue;
        const l=-.45*nx-.55*ny+.7*Math.sqrt(1-d);
        let px=Math.round(cx+i);if(wrap)px=((px%this.w)+this.w)%this.w;
        this.dith(px,py,ramp,Math.max(0,Math.min(1,(l+.25)/1.1)));
      }
    }
    return this;
  }
  text(s,x,y,c,sc=1){s=norm(s);for(let i=0;i<s.length;i++){const rows=FONT[s[i]]||FONT['?'];for(let r=0;r<8;r++)for(let q=0;q<8;q++)if(rows[r]&(0x80>>q))this.rect(x+i*8*sc+q*sc,y+r*sc,sc,sc,c);}return this;}
  outline(c){
    const {w,h,u}=this,m=new Uint8Array(w*h);for(let i=0;i<w*h;i++)m[i]=u[i]?1:0;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(m[i])continue;
      if((x>0&&m[i-1])||(x<w-1&&m[i+1])||(y>0&&m[i-w])||(y<h-1&&m[i+w]))u[i]=P32[c];}
    return this;
  }
  mirror(){const o=new PB(this.w,this.h);for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++)o.u[y*this.w+x]=this.u[y*this.w+this.w-1-x];return o;}
  blit(o,dx,dy){for(let y=0;y<o.h;y++)for(let x=0;x<o.w;x++){const v=o.u[y*o.w+x];if(!v)continue;const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<this.w&&Y<this.h)this.u[Y*this.w+X]=v;}return this;}
  canvas(){const c=document.createElement('canvas');c.width=this.w;c.height=this.h;const x=c.getContext('2d');const id=x.createImageData(this.w,this.h);new Uint32Array(id.data.buffer).set(this.u);x.putImageData(id,0,0);return c;}
}
let srng=77;function srand(){srng=(srng*1103515245+12345)&0x7fffffff;return srng/0x7fffffff;}
function pattern(c1,c2,level){ // 4x4 ordered-dither tile: `level` share of c2
  const b=new PB(4,4);for(let y=0;y<4;y++)for(let x=0;x<4;x++)b.set(x,y,bay(x,y)<level?c2:c1);
  return ctx.createPattern(b.canvas(),'repeat');
}

// Formula racer seen from behind. 128x68, tyres drawn separately so the body can shear when steering.
const TEAMS=['CERT RACER','ACME','X.509','OCSP','PKI','TLS 1.3','CSR','HSM','SHA-256','ECDSA'];
const SCHEMES=[
  {m:RD,h:LR,s:BR,st:WH,hel:[OR,YE,WH],wt:WH},          // player

function carBody(C,team,p,brake){
  const b=new PB(128,68),o=-p*2; // o: vertical offset of the upper parts (pitch)
  // rear wing: upper flap, main plane with team name, end plates
  b.span(o+1,24,104,C.s);b.span(o+2,24,104,C.h);
  b.rect(18,o+4,92,10,C.m);b.span(o+4,18,110,C.h);b.span(o+13,18,110,C.s);
  b.text(team,64-norm(team).length*4,o+5,C.wt,1);
  b.rect(13,o+1,6,22,C.s);b.rect(13,o+1,1,22,C.h);b.rect(109,o+1,6,22,C.s);b.rect(114,o+1,1,22,C.h);
  b.rect(13,o+9,6,3,C.st);b.rect(109,o+9,6,3,C.st);
  // pylons
  b.rect(57,o+14,4,14,DG);b.rect(57,o+14,1,14,GY);b.rect(67,o+14,4,14,DG);b.rect(67,o+14,1,14,GY);
  // helmet with a stripe
  b.blob(64,o/2+26,9,8,[C.hel[0],C.hel[1],C.hel[1],C.hel[2]]);
  b.span(Math.round(o/2+23),55,74,C.st===K?RD:C.st);b.span(Math.round(o/2+24),56,73,C.st===K?RD:C.st);
  // engine cover
  for(let y=29;y<52;y++){const t=(y-29)/23,hw=11+t*20;
    for(let x=Math.round(64-hw);x<Math.round(64+hw);x++){const u=(x-64)/hw;b.dith(x,y,[C.s,C.m,C.m,C.h],.72-u*.42-t*.12);}}
  for(let y=30;y<47;y++){const hw=3+(y-30)*.18;b.span(y,64-hw,64+hw,C.st);}
  // sidepods
  for(let y=40;y<53;y++){const t=(y-40)/12;b.span(y,28+t*2,44,C.m);b.span(y,84,100-t*2,C.m);}
  b.span(40,28,44,C.h);b.span(40,84,100,C.h);b.span(52,30,98,C.s);
  b.rect(29,43,6,6,K);b.rect(93,43,6,6,K); // cooling outlets
  // suspension arms
  for(let i=0;i<5;i++){b.set(27-i,42-Math.round(i*.5),DG);b.set(101+i,42-Math.round(i*.5),DG);b.set(27-i,50,GY);b.set(101+i,50,GY);}
  // diffuser with fins
  b.rect(36,53,56,9,K);for(let x=39;x<92;x+=7)b.rect(x,54,1,7,DG);b.span(61,36,92,DG);
  // exhaust and rain light

  addSprite(Math.floor(N*.18),SPR.greet,-1.32);addSprite(Math.floor(N*.72),SPR.greet,1.32);
  for(let n=30;n<N-8;n+=Math.floor(4+rand()*6)){
    if(n>START_SEG-4&&n<START_SEG+4)continue;

    if(z===1){
      if(r<.62){def=side<0?SPR.palmL:SPR.palmR;off=1.2+rand()*1.3;}else if(r<.82){def=SPR.rock;off=1.3+rand()*1.6;}else{def=SPR.bushF;off=1.2+rand()*1.6;}

  p.screen.scale=camDepth/p.camera.z;

// Road drawn scanline by scanline: crisp pixel edges, no anti-aliased polygon seams.
function roadRows(seg,y0,y1){
  const p1=seg.p1.screen,p2=seg.p2.screen,dy=p1.y-p2.y,lt=seg.light,z=seg.zone;
  const gF=FILL.grass[z][lt?0:1],rF=FILL.road[lt?0:1],ruF=PAL[lt?WH:RD],seaF=FILL.sea[lt?0:1];
  for(let y=y0;y<y1;y++){
    const t=(p1.y-y-.5)/dy,cx=p1.x+(p2.x-p1.x)*t,w=p1.w+(p2.w-p1.w)*t,rw=w/7;
    ctx.fillStyle=gF;ctx.fillRect(0,y,W,1);
    if(z===1){const se=cx-w*SEA_OFF;if(se>0){hr(0,se,y,seaF);hr(se,se+Math.max(1,w*.07),y,PAL[WH]);}}
    hr(cx-w-rw,cx+w+rw,y,ruF);
    hr(cx-w-rw,cx-w-rw+Math.max(1,rw*.12),y,PAL[K]);hr(cx+w+rw-Math.max(1,rw*.12),cx+w+rw,y,PAL[K]);
    hr(cx-w,cx+w,y,rF);
    const ew=Math.max(1,w/34);hr(cx-w+ew,cx-w+ew*2,y,PAL[LGY]);hr(cx+w-ew*2,cx+w-ew,y,PAL[LGY]);

      for(let i=0;i<n;i++)hr(cx-w+i*bw,cx-w+(i+1)*bw,y,PAL[(i+ph)&1?K:WH]);
    }else if(lt){
      const lw=Math.max(1,w/40);for(let l=1;l<LANES;l++){const lx=cx-w+2*w*l/LANES;hr(lx-lw/2,lx+lw/2,y,PAL[WH]);}
    }
  }
}
function drawSprite(img,scale,x,y,offset,clipY,worldW,anchor,shadow){
  const dw=worldW*scale*W/2,dh=dw*img.height/img.width;
  let dx=x+scale*offset*ROAD_W*W/2;
  if(anchor===.5)dx-=dw/2;else if(offset<0)dx-=dw;
  const dy=y-dh;
  if(dw<1||dx>W||dx+dw<0)return;
  const clipH=Math.max(0,dy+dh-clipY);if(clipH>=dh)return;
  if(shadow&&clipH<=0){ctx.fillStyle=PAL[K];const sw=dw*.94,sh=Math.max(1,Math.round(dw*.035));ctx.fillRect(Math.round(dx+(dw-sw)/2),Math.round(y-sh*.6),Math.round(sw),sh);}
  ctx.drawImage(img,0,0,img.width,img.height*(1-clipH/dh),Math.round(dx),Math.round(dy),Math.max(1,Math.round(dw)),Math.max(1,Math.round(dh-clipH)));
}

let AC=null,master=null,eng=null,sq=null,rum=null,NB=null;
function initAudio(){
  if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;return;}
  master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const g=AC.createGain();g.gain.value=0;g.connect(master);
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=900;f.Q.value=3;f.connect(g);
  const o1=AC.createOscillator();o1.type='sawtooth';o1.connect(f);o1.start();
  const o2=AC.createOscillator();o2.type='square';const g2=AC.createGain();g2.gain.value=.45;o2.connect(g2);g2.connect(f);o2.start();
  const o3=AC.createOscillator();o3.type='triangle';const g3=AC.createGain();g3.gain.value=.6;o3.connect(g3);g3.connect(g);o3.start();
  eng={g,f,o1,o2,o3};
  const so=AC.createOscillator();so.type='square';so.frequency.value=1150;
  const lfo=AC.createOscillator();lfo.frequency.value=17;const lg=AC.createGain();lg.gain.value=70;lfo.connect(lg);lg.connect(so.frequency);
  const sf=AC.createBiquadFilter();sf.type='bandpass';sf.frequency.value=1400;const sg=AC.createGain();sg.gain.value=0;
  so.connect(sf);sf.connect(sg);sg.connect(master);so.start();lfo.start();sq=sg;
  const rs=AC.createBufferSource();rs.buffer=NB;rs.loop=true;const rf=AC.createBiquadFilter();rf.type='lowpass';rf.frequency.value=240;
  const rg=AC.createGain();rg.gain.value=0;rs.connect(rf);rf.connect(rg);rg.connect(master);rs.start();rum=rg;
}
function engine(on,rpm,gear){

  if(!AC||muted)return;const t=AC.currentTime+when;const s=AC.createBufferSource();s.buffer=NB;
  const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(f1,t);fl.frequency.exponentialRampToValueAtTime(f2,t+dur);

const parts=[],pops=[];let bnr=null;
function emit(x,y,vx,vy,life,size,ramp,o){
  if(parts.length>520)parts.shift();
  parts.push({x,y,vx,vy,life,max:life,size,ramp,g:o&&o.g||0,grow:o&&o.grow||0,puff:!!(o&&o.puff),drag:o&&o.drag||0});
}
function burst(x,y,n,spd,life,ramp,size,g){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=spd*(.3+Math.random()*.8);emit(x,y,Math.cos(a)*v,Math.sin(a)*v,life*(.6+Math.random()*.6),size,ramp,{g});}}
function firework(){
  const x=Math.random()<.5?20+Math.random()*80:540+Math.random()*80,y=40+Math.random()*120;
  const c=[[WH,YE,OR,RD],[WH,CY,LB,BL],[WH,LG,GR,DG],[WH,LR,PU,BL],[WH,YE,LG,GR]][Math.floor(Math.random()*5)];
  burst(x,y,36,110,1.2,c,2,40);beep(200+Math.random()*200,.25,'triangle',.03);noise(.2,.08,1500,200);

function updateParticles(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    p.vy+=p.g*dt;if(p.drag){const d=Math.pow(1-p.drag,dt);p.vx*=d;p.vy*=d;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.size+=p.grow*dt;if((p.life-=dt)<=0)parts.splice(i,1);}
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.y-=26*dt;if((p.t-=dt)<=0)pops.splice(i,1);}
  if(bnr&&(bnr.t+=dt)>bnr.dur)bnr=null;
}
function renderParticles(){
  for(const p of parts){
    const k=1-p.life/p.max,col=p.ramp[Math.min(p.ramp.length-1,Math.floor(k*p.ramp.length))];
    if(p.puff){const c=puff(col,p.size/2);ctx.drawImage(c,Math.round(p.x-c.width/2),Math.round(p.y-c.height/2));}
    else{const s=Math.max(1,Math.round(p.size));ctx.fillStyle=PAL[col];ctx.fillRect(Math.round(p.x-s/2),Math.round(p.y-s/2),s,s);}

}

function carSteer(car,seg,playerSeg,dt){

function updateCars(dt){

}
function updateRace(dt){

  raceT+=dt;goT=Math.max(0,goT-dt);
